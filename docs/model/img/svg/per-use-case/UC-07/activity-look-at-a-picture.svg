.2072"/><polygon fill="#333333" points="184.5,392.2072,188.5,402.2072,192.5,392.2072,188.5,396.2072" style="stroke: #333333; stroke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.5;" x1="188.5" x2="188.5" y1="831.7124" y2="863.7124"/><polygon fill="#333333" points="184.5,853.7124,188.5,863.7124,192.5,853.7124,188.5,857.7124" style="stroke: #333333; stroke-width: 1.0;"/><!--MD5=[3754673afe17327d0d77727d74ba43ab]
@startuml

skinparam shadowing false
skinparam {
  BackgroundColor White
  BorderColor #333
  ArrowColor #333
}

start
:the picture is open in a tab;

partition "the picture's page" {
  :the picture is drawn at its own pixels,\nand is not shrunk to fit the window (F-19);
  if (the picture is an SVG?) then (yes)
    :it is drawn as a vector, and stays sharp at every zoom;
  else (no)
  endif
}

partition "the reader" {
  if (the reader zooms?) then (yes)
    :the zoom is about the pointer (F-20);
  else (no)
  endif
  if (the reader drags?) then (yes)
    :the picture moves with the hand (F-21);
  else (no)
  endif
  if (the reader fits it, or puts it back to 1:1?) then (yes)
    :the scale changes;
  else (no)
  endif
}

stop
@enduml

