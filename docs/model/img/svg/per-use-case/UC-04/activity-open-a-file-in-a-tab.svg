4,383.5,751.9094,379.5,755.9094" style="stroke: #333333; stroke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.5;" x1="379.5" x2="379.5" y1="636.0744" y2="656.0744"/><polygon fill="#333333" points="375.5,646.0744,379.5,656.0744,383.5,646.0744,379.5,650.0744" style="stroke: #333333; stroke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.5;" x1="379.5" x2="379.5" y1="537.0604" y2="599.7303"/><polygon fill="#333333" points="375.5,589.7303,379.5,599.7303,383.5,589.7303,379.5,593.7303" style="stroke: #333333; stroke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.5;" x1="379.5" x2="379.5" y1="785.9094" y2="817.9094"/><polygon fill="#333333" points="375.5,807.9094,379.5,817.9094,383.5,807.9094,379.5,811.9094" style="stroke: #333333; stroke-width: 1.0;"/><!--MD5=[b09c73c9947922957ee590646b91ee65]
@startuml

skinparam shadowing false
skinparam {
  BackgroundColor White
  BorderColor #333
  ArrowColor #333
}

start
:the workspace is open;

partition "the workspace" {
  if (the reader clicks a file in the tree?) then (yes)
    :a tab is opened for it, with the mark of\nits kind and its name;
  else (no)
    if (the reader drops a file, or picks one?) then (yes)
      :the file is kept for two hours, outside the\nreader's folders, and opened in a tab (F-9);
    else (no)
      if (a note links to it?) then (yes)
        :the window above is asked to open it in a tab;
      else (no)
        :nothing happens;
      endif
    endif
  endif
  :the file's own page is asked for;
}

partition "the reader" {
  :the page is served, without the bar that\ngoes back to the library;
}

partition "the browser" {
  :the page is shown in the tab's frame;
  if (another file is opened?) then (yes)
    :a second tab; the first keeps its place;
  else (no)
  endif
}

stop
@enduml

