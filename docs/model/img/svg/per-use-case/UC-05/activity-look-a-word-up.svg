3333; stroke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.5;" x1="386" x2="398" y1="723.7766" y2="723.7766"/><polygon fill="#333333" points="394,769.4396,398,779.4396,402,769.4396,398,773.4396" style="stroke: #333333; stroke-width: 1.5;"/><line style="stroke: #333333; stroke-width: 1.5;" x1="398" x2="398" y1="723.7766" y2="829.6117"/><line style="stroke: #333333; stroke-width: 1.5;" x1="398" x2="303" y1="829.6117" y2="829.6117"/><polygon fill="#333333" points="313,825.6117,303,829.6117,313,833.6117,309,829.6117" style="stroke: #333333; stroke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.5;" x1="291" x2="291" y1="797.6117" y2="817.6117"/><polygon fill="#333333" points="287,807.6117,291,817.6117,295,807.6117,291,811.6117" style="stroke: #333333; stroke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.5;" x1="291" x2="291" y1="691.7766" y2="711.7766"/><polygon fill="#333333" points="287,701.7766,291,711.7766,295,701.7766,291,705.7766" style="stroke: #333333; stroke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.5;" x1="291" x2="291" y1="841.6117" y2="861.6117"/><polygon fill="#333333" points="287,851.6117,291,861.6117,295,851.6117,291,855.6117" style="stroke: #333333; stroke-width: 1.0;"/><!--MD5=[4faccf6d1d7309ffc05c498c80757034]
@startuml

skinparam shadowing false
skinparam {
  BackgroundColor White
  BorderColor #333
  ArrowColor #333
}

start
:the reader double-clicks a word;

partition "the card" {
  :the word is read from the page's own text;
  :the background script is asked for it (F-11);
}

partition "the extension" {
  if (the URL is one of the three hosts?) then (yes)
    :the dictionary is asked, with no credentials\nand no referrer (S-2, P-11);
  else (no)
    :the request is refused before it is made;
  endif
}

partition "the dictionary" {
  :the senses;
}

partition "the card" {
  :the card is placed from the word's own box,\nso it sits where the word is (F-13);
}

:the senses are shown, with the part of speech;

if (the reader presses the speaker?) then (yes)
  :the word is spoken (F-13);
else (no)
endif

stop
@enduml

