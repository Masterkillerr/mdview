3; stroke-width: 1.5;" x1="175.5" x2="175.5" y1="863.2538" y2="883.2538"/><polygon fill="#333333" points="171.5,873.2538,175.5,883.2538,179.5,873.2538,175.5,877.2538" style="stroke: #333333; stroke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.5;" x1="175.5" x2="175.5" y1="741.0746" y2="761.0746"/><polygon fill="#333333" points="171.5,751.0746,175.5,761.0746,179.5,751.0746,175.5,755.0746" style="stroke: #333333; stroke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.5;" x1="175.5" x2="175.5" y1="398.7346" y2="461.4045"/><polygon fill="#333333" points="171.5,451.4045,175.5,461.4045,179.5,451.4045,175.5,455.4045" style="stroke: #333333; stroke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.5;" x1="175.5" x2="175.5" y1="907.2538" y2="969.9237"/><polygon fill="#333333" points="171.5,959.9237,175.5,969.9237,179.5,959.9237,175.5,963.9237" style="stroke: #333333; stroke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.5;" x1="175.5" x2="175.5" y1="1006.2678" y2="1038.2678"/><polygon fill="#333333" points="171.5,1028.2678,175.5,1038.2678,179.5,1028.2678,175.5,1032.2678" style="stroke: #333333; stroke-width: 1.0;"/><!--MD5=[419c7ea2161a499ad2ab8a22a226b291]
@startuml

skinparam shadowing false
skinparam {
  BackgroundColor White
  BorderColor #333
  ArrowColor #333
}

start
:the PDF is open in a tab;

partition "the reader" {
  :the bytes are handed to pdf.js;
  :every page gets a box, at the size the file says (F-15);
  :the page count and the scrollbar are right at once;
  :only the pages near the reader are painted;
  :the paint, and the file's own text over it (F-16);
}

partition "the reader" {
  if (the reader turns a page, or types one?) then (yes)
    :that page is shown (F-17);
  else (no)
  endif
  if (the reader zooms?) then (yes)
    :the pages take a new size, and the place is kept;
  else (no)
  endif
  if (the reader drags the page?) then (yes)
    :the page moves with the pointer, unless the drag\nstarted on a word (F-18);
  else (no)
  endif
}

partition "the browser's storage" {
  :the place, keyed by the file's address;
}

stop
@enduml

