 y2="448.0744"/><polygon fill="#333333" points="342.5,501.9094,346.5,511.9094,350.5,501.9094,346.5,505.9094" style="stroke: #333333; stroke-width: 1.5;"/><line style="stroke: #333333; stroke-width: 1.5;" x1="346.5" x2="346.5" y1="448.0744" y2="570.2536"/><line style="stroke: #333333; stroke-width: 1.5;" x1="346.5" x2="210.5" y1="570.2536" y2="570.2536"/><polygon fill="#333333" points="220.5,566.2536,210.5,570.2536,220.5,574.2536,216.5,570.2536" style="stroke: #333333; stroke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.5;" x1="198.5" x2="198.5" y1="538.2536" y2="558.2536"/><polygon fill="#333333" points="194.5,548.2536,198.5,558.2536,202.5,548.2536,198.5,552.2536" style="stroke: #333333; stroke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.5;" x1="198.5" x2="198.5" y1="404.0744" y2="436.0744"/><polygon fill="#333333" points="194.5,426.0744,198.5,436.0744,202.5,426.0744,198.5,430.0744" style="stroke: #333333; stroke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.5;" x1="198.5" x2="198.5" y1="582.2536" y2="602.2536"/><polygon fill="#333333" points="194.5,592.2536,198.5,602.2536,202.5,592.2536,198.5,596.2536" style="stroke: #333333; stroke-width: 1.0;"/><!--MD5=[2410f131d8ec3347fa58b48430668f12]
@startuml

skinparam shadowing false
skinparam {
  BackgroundColor White
  BorderColor #333
  ArrowColor #333
}

start
:the reader picks a choice: the desk, the width,\nthe face, the dictionary's language, the voice;

partition "the page" {
  :the choice is applied at once;
}

partition "the browser's storage" {
  :the choice is written down, under the reader's own key (F-27);
}

partition "every page of the reader" {
  :the choice is read when the page opens,\nand the page follows it;
}

if (the browser refuses to keep the choice?) then (yes)
  :the choice applies to the page, and is not kept,\nand the reader is not troubled;
else (no)
endif

stop
@enduml

