" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="109" x="60" y="573.6231">closes the window</text><polygon fill="#333333" points="222,607.1381,232,611.1381,222,615.1381,226,611.1381" style="stroke: #333333; stroke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.0;" x1="35" x2="228" y1="611.1381" y2="611.1381"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="42" y="605.3291">13</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="84" x="60" y="605.3291">opens it again</text><polygon fill="#333333" points="804,638.8441,814,642.8441,804,646.8441,808,642.8441" style="stroke: #333333; stroke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.0;" x1="244" x2="810" y1="642.8441" y2="642.8441"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="251" y="637.0351">14</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="54" x="269" y="637.0351">the place</text><polygon fill="#333333" points="255,670.5501,245,674.5501,255,678.5501,251,674.5501" style="stroke: #333333; stroke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.0;" x1="249" x2="815" y1="674.5501" y2="674.5501"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="261" y="668.7411">15</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="54" x="279" y="668.7411">the place</text><line style="stroke: #333333; stroke-width: 1.0;" x1="244" x2="286" y1="711.2562" y2="711.2562"/><line style="stroke: #333333; stroke-width: 1.0;" x1="286" x2="286" y1="711.2562" y2="724.2562"/><line style="stroke: #333333; stroke-width: 1.0;" x1="239" x2="286" y1="724.2562" y2="724.2562"/><polygon fill="#333333" points="249,720.2562,239,724.2562,249,728.2562,245,724.2562" style="stroke: #333333; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="251" y="705.4472">16</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="112" x="269" y="705.4472">go to that heading</text><polygon fill="#333333" points="46,746.9622,36,750.9622,46,754.9622,42,750.9622" style="stroke: #333333; stroke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.0;" x1="40" x2="238" y1="750.9622" y2="750.9622"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="52" y="745.1532">17</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="162" x="70" y="745.1532">the note is where it was left</text><!--MD5=[640692ea7c0f9618b1a221e0529d7903]
@startuml

skinparam shadowing false
skinparam ArrowColor #333
autonumber

actor Reader
participant "The note's page" as PAGE
participant "The renderer\n(mdview.js)" as MD
participant "The reader\n(server.py)" as SRV
database "The browser's\nstorage" as STORE

Reader -> PAGE : opens the note
activate PAGE
PAGE -> SRV : GET /f/<path> (the bytes)
activate SRV
SRV -> PAGE : the bytes
deactivate SRV
PAGE -> MD : the source
activate MD
MD -> MD : the block parser and the inline\ntokenizer (F-3)
MD -> MD : the raw HTML is filtered, not\npassed through (S-4)
MD -> PAGE : the document, the masthead,\nthe outline
deactivate MD
deactivate PAGE
PAGE -> Reader : the note is on the screen

Reader -> PAGE : scrolls
activate PAGE
PAGE -> PAGE : which heading is the reading line at?\n(a page and a fraction of a page, F-4)
PAGE -> STORE : the place, keyed by the file's address
deactivate PAGE

Reader -> PAGE : closes the window
Reader -> PAGE : opens it again
activate PAGE
PAGE -> STORE : the place
STORE -> PAGE : the place
PAGE -> PAGE : go to that heading
deactivate PAGE
PAGE -> Reader : the note is where it was left
@enduml

