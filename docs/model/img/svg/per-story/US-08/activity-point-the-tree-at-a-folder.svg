2,396.125,162.6882,400.125,152.6882,396.125,156.6882" style="stroke: #333333; stroke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.5;" x1="396.125" x2="396.125" y1="634.3583" y2="654.3583"/><polygon fill="#333333" points="392.125,644.3583,396.125,654.3583,400.125,644.3583,396.125,648.3583" style="stroke: #333333; stroke-width: 1.0;"/><!--MD5=[eda91aced894e5bdaeba479ea25331ca]
@startuml

skinparam shadowing false
skinparam {
  BackgroundColor White
  BorderColor #333
  ArrowColor #333
}

start
:the reader hovers a folder in the tree;
:the three dots appear on its row;

if (the reader clicks them?) then (yes)
  :the menu opens, beside the row;
  if (the reader goes to that folder?) then (yes)
    :the tree is moved there, and kept there (F-25);
  else (no)
    if (the reader adds it to the reader's own?) then (yes)
      :the folder is added, and the tree is moved there;
    else (no)
      if (the reader opens it in the library?) then (yes)
        :the library is asked for that folder;
      else (no)
        if (the reader copies its path?) then (yes)
          :the path is on the clipboard;
        else (no)
        endif
      endif
    endif
  endif
else (no)
endif

stop
@enduml

