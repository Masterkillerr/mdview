157" x2="157" y1="894.7344" y2="914.7344"/><polygon fill="#333333" points="153,904.7344,157,914.7344,161,904.7344,157,908.7344" style="stroke: #333333; stroke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.5;" x1="157" x2="157" y1="146.0752" y2="179.4622"/><polygon fill="#333333" points="153,169.4622,157,179.4622,161,169.4622,157,173.4622" style="stroke: #333333; stroke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.5;" x1="157" x2="157" y1="951.0785" y2="971.0785"/><polygon fill="#333333" points="153,961.0785,157,971.0785,161,961.0785,157,965.0785" style="stroke: #333333; stroke-width: 1.0;"/><!--MD5=[b919d2d4fcd47652525f9304bcee5c22]
@startuml

skinparam shadowing false
skinparam {
  BackgroundColor White
  BorderColor #333
  ArrowColor #333
}

start
:the reader opens the workspace;
:the workspace asks for the roots;
note right
  The folders the reader shows are the
  reader's own list. The tree can walk out
  of them, one level at a time.
end note

while (the reader is in the tree?) is (yes)
  partition "the workspace" {
    :the folder it stands in is asked for;
    :the names come back, with the facts\nabout the names;
    note right
      F-6: one folder at a time. The bytes of a
      file are not read to find out what the
      file is.
    end note
  }
  partition "the reader" {
    :the names are read from the disk;
  }

  if (the reader clicks a folder?) then (yes)
    :the folder is added to the open ones;
    :its contents are asked for;
  else (no)
  endif

  if (the reader clicks the way up?) then (yes)
    :the tree stands in the folder above;
    note right
      F-8: a folder that cannot be shown is
      refused in words, naming the folder.
    end note
  else (no)
  endif
endwhile (no)
:the window is closed;

stop
@enduml

