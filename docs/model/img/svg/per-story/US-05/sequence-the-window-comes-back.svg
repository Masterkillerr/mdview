333333; stroke-width: 1.0;" x1="320" x2="772.5" y1="295.01" y2="295.01"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="7" x="332" y="289.201">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="165" x="343" y="289.201">the folder the tree stands in</text><line style="stroke: #333333; stroke-width: 1.0;" x1="315" x2="357" y1="349.4221" y2="349.4221"/><line style="stroke: #333333; stroke-width: 1.0;" x1="357" x2="357" y1="349.4221" y2="362.4221"/><line style="stroke: #333333; stroke-width: 1.0;" x1="310" x2="357" y1="362.4221" y2="362.4221"/><polygon fill="#333333" points="320,358.4221,310,362.4221,320,366.4221,316,362.4221" style="stroke: #333333; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="7" x="322" y="334.7601">7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="151" x="333" y="325.907">the tabs are drawn again,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="297" x="333" y="343.6131">and the one that was being read is the one shown</text><!--MD5=[060d70f4258beaa437cc4916a058d954]
@startuml

skinparam shadowing false
skinparam ArrowColor #333
autonumber

actor Reader
participant "The browser" as BR
participant "The workspace" as WS
database "The browser's storage" as STORE
participant "The reader" as SRV

Reader -> BR : reloads the window
activate BR
BR -> WS : the page runs
activate WS
WS -> STORE : the window's state: the folder,\nthe open files, the filters
STORE -> WS : the state
WS -> SRV : GET /api/tree
activate SRV
SRV -> WS : the folder the tree stands in
deactivate SRV
WS -> WS : the tabs are drawn again,\nand the one that was being read is the one shown
deactivate WS
deactivate BR
@enduml

