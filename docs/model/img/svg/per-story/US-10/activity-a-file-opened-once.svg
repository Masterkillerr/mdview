roke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.5;" x1="165.5" x2="165.5" y1="600.788" y2="632.788"/><polygon fill="#333333" points="161.5,622.788,165.5,632.788,169.5,622.788,165.5,626.788" style="stroke: #333333; stroke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.5;" x1="165.5" x2="165.5" y1="30" y2="50"/><polygon fill="#333333" points="161.5,40,165.5,50,169.5,40,165.5,44" style="stroke: #333333; stroke-width: 1.0;"/><line style="stroke: #333333; stroke-width: 1.5;" x1="165.5" x2="165.5" y1="656.788" y2="676.788"/><polygon fill="#333333" points="161.5,666.788,165.5,676.788,169.5,666.788,165.5,670.788" style="stroke: #333333; stroke-width: 1.0;"/><!--MD5=[abcf4307c1dbb0322967de96c41c381c]
@startuml

skinparam shadowing false
skinparam {
  BackgroundColor White
  BorderColor #333
  ArrowColor #333
}

start
if (the reader drops a file on the window,\nor picks one with the + button?) then (yes)
  partition "the reader" {
    :the file is copied into a scratch folder\noutside the reader's own folders;
    :the copy is given an id;
    :the answer says where the copy is shown;
  }
  partition "the workspace" {
    :the copy is opened in a tab;
  }
  partition "the reader" {
    if (the copy is older than two hours?) then (yes)
      :it is removed, and it never entered the library;
    else (no)
    endif
  }
else (no)
endif

stop
@enduml

