he card asks the background script and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="235" x="254.75" y="790.4792">never the dictionary itself: a page's own</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="209" x="254.75" y="808.1852">fetch is subject to that page's rules,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="217" x="254.75" y="825.8912">and the background script holds the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="143" x="254.75" y="843.5972">permissions (ADR-0007).</text><!--MD5=[817521c978b775b3e2db650964334a11]
@startuml

skinparam shadowing false
skinparam ArrowColor #333
autonumber

actor Reader
participant "The card\n(lookup.js)" as CARD
participant "Extension\n(background)" as EXT
participant "Dictionary" as DICT

Reader -> CARD : double-clicks a word
activate CARD
CARD -> CARD : is there a word here?\n(the page's own text layer)
CARD -> EXT : mdview:fetch, the dictionary's URL (F-11)
activate EXT
EXT -> EXT : is it api.dictionaryapi.dev,\napi.datamuse.com or en.wiktionary.org? (S-2)

alt the URL is one of the three hosts
  EXT -> DICT : the request, with no credentials\nand no referrer (P-11)
  activate DICT
  DICT -> EXT : the senses
  deactivate DICT
  EXT -> CARD : the text
  deactivate EXT
  CARD -> CARD : the card is placed from the word's\nown box, so it sits where the word is (F-13)
  deactivate CARD
  CARD -> Reader : the card, with the senses\nand the part of speech
  Reader -> CARD : presses the speaker
  activate CARD
  CARD -> Reader : the word, spoken (F-13)
  deactivate CARD
else the word is Spanish
  EXT -> DICT : en.wiktionary.org (F-12)
  activate DICT
  DICT -> EXT : the senses
  deactivate DICT
  EXT -> CARD : the text
  deactivate EXT
  CARD -> Reader : the card
end

note over CARD, EXT
  The card asks the background script and
  never the dictionary itself: a page's own
  fetch is subject to that page's rules,
  and the background script holds the
  permissions (ADR-0007).
end note
@enduml

