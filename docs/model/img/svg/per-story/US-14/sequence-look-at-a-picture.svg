 fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="236" x="474" y="561.8492">F-19: a picture is shown at its own pixels</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="221" x="474" y="579.5552">and is not shrunk to fit the window: a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="164" x="474" y="597.2612">shrunk picture is a soft one.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="0" x="477" y="614.9672"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="212" x="474" y="632.6732">F-20: the zoom is about the pointer.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="0" x="477" y="650.3792"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="241" x="474" y="668.0853">F-21: a picture bigger than the window is</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="131" x="474" y="685.7913">moved with the hand.</text><!--MD5=[ebf69bc452625945ca1ae9995ac3db8b]
@startuml

skinparam shadowing false
skinparam ArrowColor #333
autonumber

actor Reader
participant "The picture's page" as PAGE
participant "The stage" as STAGE
participant "The image" as IMG
participant "The tools" as BAR

Reader -> PAGE : opens the file
activate PAGE
PAGE -> IMG : the picture
activate IMG
IMG -> PAGE : its own size — 1536 by 1024
deactivate IMG
PAGE -> STAGE : the picture is drawn at its own pixels (F-19)
deactivate PAGE
PAGE -> Reader : the picture, sharp

Reader -> BAR : zooms in
activate BAR
BAR -> STAGE : zoom about the pointer (F-20)
activate STAGE
STAGE -> IMG : the scale changes, and what is\nunder the pointer stays under it
deactivate STAGE
deactivate BAR

Reader -> STAGE : drags the picture
activate STAGE
STAGE -> STAGE : the picture moves with the pointer (F-21)
deactivate STAGE

Reader -> BAR : fits it, or puts it back to 1:1
activate BAR
BAR -> STAGE : the scale changes
deactivate BAR

Reader -> PAGE : clicks a picture in a note
activate PAGE
PAGE -> PAGE : the picture opens in this view,\nin a tab of the window above (F-28)
deactivate PAGE

note right
  F-19: a picture is shown at its own pixels
  and is not shrunk to fit the window: a
  shrunk picture is a soft one.

  F-20: the zoom is about the pointer.

  F-21: a picture bigger than the window is
  moved with the hand.
end note
@enduml

