link Held to Closed--><path d="M120.49,613.48 C125.87,620.17 131.69,626.46 137.92,632 C241.19,723.82 415.43,739.25 491.96,741.42 " fill="none" id="Held-&gt;Closed" style="stroke: #333333; stroke-width: 1.0;"/><polygon fill="#333333" points="497.29,741.56,488.3958,737.33,492.2917,741.4315,488.1902,745.3273,497.29,741.56" style="stroke: #333333; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="171" x="211.92" y="676.897">the file is not there any more</text><!--MD5=[6a0120e955106c3c4a200726973d82ea]
@startuml

skinparam shadowing false
skinparam ArrowColor #333

[*] - -> Closed : the window opens

state Closed {
}

state Open {
  [*] - -> Loading
  Loading - -> Shown : the file's own page answers
  Shown - -> [*]
}

state Held {
  [*] - -> Kept
  Kept - -> [*]
}

Closed - -> Open : the reader clicks a file\nin the tree, or the address names one
Open - -> Open : a second file (a second tab)
Open - -> Closed : the tab is closed
Open - -> Held : the reader reloads the window
Held - -> Open : the window comes back (F-10)
Held - -> Closed : the file is not there any more

note right of Open
  A tab is the reader's own page in a
  frame (ADR-0003). Eight frames are
  kept alive. The oldest is let go of.
end note

note right of Held
  The window's state is kept in the
  browser's storage under one key,
  and nowhere else (F-10, S-6).
end note

note right of Closed
  The file is not in the window, but it
  is on the disk, and the reader's
  place in it is kept (F-4).
end note
@enduml

